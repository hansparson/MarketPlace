worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        client_max_body_size 50M;

        # Detect social media crawlers and serve them Open Graph HTML
        location ~ ^/products/([a-fA-F0-9-]+)$ {
            set $product_id $1;
            
            # Check if request is from a social media crawler
            if ($http_user_agent ~* "WhatsApp|facebookexternalhit|facebookplatform|Facebot|Twitterbot|LinkedInBot|TelegramBot|Discordbot|Slackbot") {
                # Redirect crawler to OG endpoint
                return 307 /api/og/product/$product_id;
            }
            
            # Normal users get the React SPA
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other frontend routes
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Explicitly match /api path and forward exactly as is
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy for MinIO assets
        location /storage/ {
            proxy_pass http://minio:9000/marketplace/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to external Wilayah API to bypass Backend connectivity issues
        location ^~ /wilayah-api {
            proxy_pass https://wilayah.web.id/api;
            proxy_ssl_server_name on;
            proxy_set_header Host wilayah.web.id;
            proxy_set_header Origin "https://wilayah.web.id";
            proxy_set_header Referer "https://wilayah.web.id/";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
