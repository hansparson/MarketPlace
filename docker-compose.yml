version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - postgres
      - redis
      - minio
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiY2ExZjYyNDc5MjAzNGVlZTEzYjkxYzdiMzMxODk1ZjQiLCJ0IjoiMWZhNTYyZmEtODEzMS00MGZiLTgyNGUtMWM0ZDMzODVmMTc2IiwicyI6IllXRmtOMkkwWmpVdE9HTXdOaTAwWmpFeExXSTJaall0TVdVM01UY3pNR1ZsWlRjNCJ9
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  postgres_data:
  minio_data:
