name: Go CI (Test & Audit)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Audit & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: cd backend && go mod verify

      - name: Vet Code
        run: cd backend && go vet ./...

      - name: Run Staticcheck
        run: cd backend && go run honnef.co/go/tools/cmd/staticcheck@latest -checks=all,-ST1000 ./...

      - name: Run Govulncheck
        run: cd backend && go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run Tests
        run: cd backend && go test -v ./...
