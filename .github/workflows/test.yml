name: CI (Test & Audit)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-audit-and-test:
    name: Backend Audit & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: cd backend && go mod verify

      - name: Vet Code
        run: cd backend && go vet ./...

      - name: Run Staticcheck
        run: cd backend && go run honnef.co/go/tools/cmd/staticcheck@latest -checks="all,-ST1000,-ST1003,-ST1020,-ST1021,-ST1023,-S1017,-SA1019,-SA9003" ./...

      - name: Run Govulncheck
        run: cd backend && go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run Tests
        run: cd backend && go test -v ./...

  frontend-audit:
    name: Frontend Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: TypeScript Compile Check
        run: cd frontend && npx tsc --noEmit

      - name: Dependency Vulnerability Audit
        run: cd frontend && (npm audit || echo "⚠️ Warning: Vulnerabilities found in frontend dependencies")
